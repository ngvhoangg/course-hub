spring:
#  profiles:
#    active: dev
  application:
    name: course-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/course_hub}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.coursehub.common.kafka.event"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:secret}
  access-token-expiration: 900000        # 15 minutes
  refresh-token-expiration: 604800000    # 7 days

sendgrid:
  api-key: ${SENDGRID_API_KEY:test}
  from-email: ${SENDGRID_FROM_EMAIL:test@example.com}
  verification-url: ${SENDGRID_VERIFICATION_URL:http://localhost}

logging:
  level:
    org.flywaydb: DEBUG

server:
  port: 8081
