spring:
  application:
    name: course-hub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:tc:postgresql:17:///testdb}
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
  kafka:
    listener:
      auto-startup: false
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.coursehub.common.kafka.event"
  spring:
    data:
      redis:
        host: localhost
        port: 6379

jwt:
  secret: ${JWT_SECRET:eW91ci1zdXBlci1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktbWluLTMyLWNoYXJz}
  access-token-expiration: 900000        # 15 minutes
  refresh-token-expiration: 604800000    # 7 days

sendgrid:
  api-key: ${SENDGRID_API_KEY:test}
  from-email: ${SENDGRID_FROM_EMAIL:test@example.com}
  verification-url: ${SENDGRID_VERIFICATION_URL:http://localhost}

app:
  cookie:
    secure: false
  rate-limit:
    enabled: false

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.kafka: DEBUG
    com.example.coursehub.common.kafka: DEBUG

server:
  port: 8081
